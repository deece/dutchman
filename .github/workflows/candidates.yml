name: Candidates

# Builds the candidate builds docs/candidates.toml lists, each Dutchman commit against its
# cadmpeg commit with the release profile, for its targets only, and publishes them on the
# rolling `candidates` pre-release with candidates.json describing them. `dutchman investigate`
# downloads them from there to say what each would change for a user's design. Runs only when
# the manifest (or this workflow) changes on main, or on demand.

on:
  push:
    branches: [main]
    paths:
      - docs/candidates.toml
      - scripts/candidates.py
      - scripts/package-candidate.py
      - .github/workflows/candidates.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidates
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          matrix=$(python3 -I scripts/candidates.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include": []}' ]; then echo "any=false"; else echo "any=true"; fi >> "$GITHUB_OUTPUT"
          python3 -I scripts/candidates.py list > candidates.json
      - uses: actions/upload-artifact@v7
        with:
          name: candidates-list
          path: candidates.json
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config python3
      # The scripts come from main; the code from the candidate's commit.
      - uses: actions/checkout@v7
        with:
          path: main
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.dutchman }}
          path: candidate
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Point the build at the candidate's cadmpeg commit
        shell: bash
        working-directory: candidate
        run: bash ../main/scripts/use-cadmpeg-main.sh "${{ matrix.cadmpeg }}" "${{ matrix.cadmpeg_repo }}"
      - name: Build
        shell: bash
        working-directory: candidate
        run: cargo build --release -p dutchman --bin dutchman --target ${{ matrix.target }}
      - name: Package
        shell: bash
        working-directory: candidate
        run: |
          archive=$(python3 -I ../main/scripts/package-candidate.py ${{ matrix.target }} "dutchman-candidate-${{ matrix.name }}-${{ matrix.target }}")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.name }}-${{ matrix.target }}
          path: |
            candidate/dist/${{ env.ARCHIVE }}
            candidate/dist/${{ env.ARCHIVE }}.sha256
          retention-days: 7

  publish:
    needs: [plan, build]
    # An empty list publishes an empty release; a failed build publishes nothing.
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Replace the candidates pre-release
        run: |
          cat > notes.md <<'EOF'
          Candidate builds, not releases: each is a Dutchman commit built against a cadmpeg
          commit, listed in docs/candidates.toml. `dutchman investigate` downloads them to say
          what each would change for a design. candidates.json says what each one is.
          EOF
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/candidates" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/candidates -f sha="$GITHUB_SHA"
          if gh release view candidates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            for asset in $(gh release view candidates --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              gh release delete-asset candidates "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release edit candidates --repo "$GITHUB_REPOSITORY" --prerelease --title "Candidate builds" --notes-file notes.md
          else
            gh release create candidates --repo "$GITHUB_REPOSITORY" --prerelease --title "Candidate builds" \
              --notes-file notes.md --verify-tag
          fi
          gh release upload candidates artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
